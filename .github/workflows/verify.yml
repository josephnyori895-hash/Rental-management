name: Verify Rental OS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/rental-auth-polish]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rental_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      SECRET_KEY: ci-only-secret-key-not-for-production-000000
      JWT_SECRET: ci-only-jwt-secret-not-for-production-000000
      ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/rental_test
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/rental_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
        working-directory: backend
      - name: Run backend tests
        run: pytest -q tests
        working-directory: backend
