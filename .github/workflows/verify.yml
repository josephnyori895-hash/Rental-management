name: Verify Rental OS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      APP_ENV: testing
      SECRET_KEY: ci-only-secret-key-not-for-production-000000
      JWT_SECRET: ci-only-jwt-secret-not-for-production-000000
      ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      # Two databases, two identities.
      #
      # `rental` is the CI stand-in for production and is never connected to: it
      # exists so the gate has a production identity to compare the scratch
      # target against, which is the comparison that was missing before. Tests
      # point at `rental_test` only, and the conftest guard still refuses a
      # scratch target whose name matches production or whose resolved host,
      # port and database match it. This file previously set both variables to
      # the same URL, so the guard fired at collection and the suite could not
      # run at all.
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/rental
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/rental_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Create scratch database
        run: |
          python - <<'PY'
          import asyncio

          import asyncpg


          async def main() -> None:
              conn = await asyncpg.connect(
                  host="127.0.0.1",
                  port=5432,
                  user="test",
                  password="test",
                  database="rental",
              )
              exists = await conn.fetchval(
                  "select 1 from pg_database where datname = 'rental_test'"
              )
              if not exists:
                  await conn.execute("create database rental_test")
              await conn.close()


          asyncio.run(main())
          PY

      - name: Prove the two database identities are distinct
        run: |
          python - <<'PY'
          import os

          from sqlalchemy.engine import make_url

          production = make_url(os.environ["DATABASE_URL"])
          scratch = make_url(os.environ["TEST_DATABASE_URL"])

          def identity(url):
              return (url.host or "localhost", url.port or 5432, (url.database or "").lower())

          print(f"production identity: {'/'.join(map(str, identity(production)))}")
          print(f"scratch identity   : {'/'.join(map(str, identity(scratch)))}")

          assert scratch.database.endswith("_test"), "scratch database must end with _test"
          assert identity(scratch) != identity(production), "scratch target matches production"
          PY

      # One command, the same one a developer runs. If the database is missing,
      # unreachable, or anything skips, the script exits non-zero and this job
      # fails: a skipped test is not a pass.
      - name: Release gate
        shell: bash
        run: |
          set -o pipefail
          ./scripts/verify.sh 2>&1 | tee gate.log

      - name: Upload gate log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: gate.log
          if-no-files-found: ignore
