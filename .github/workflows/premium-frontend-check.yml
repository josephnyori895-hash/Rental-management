name: Premium Frontend Verification

on:
  push:
    branches:
      - redesign/premium-experience-v2

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript, production build and Chromium responsive checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: TypeScript and production build
        run: npm run build
        working-directory: frontend
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start production preview
        run: |
          mkdir -p artifacts
          (npm run preview -- --host 127.0.0.1 > /tmp/rental-os-preview.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/rental-os-preview.log
          exit 1
        working-directory: frontend
      - name: Chromium desktop, tablet and mobile smoke tests
        run: node scripts/verify-premium-responsive.mjs
        working-directory: frontend
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-os-premium-responsive-screenshots
          path: frontend/artifacts/
          if-no-files-found: ignore
