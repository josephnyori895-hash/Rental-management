# Render blueprint — one free web service that serves the API and the built SPA.
#
# Deliberately NO Render Postgres here. Render's free database expires 30 days
# after creation and becomes inaccessible unless upgraded:
#   https://render.com/docs/free
# That is acceptable for a demo and unacceptable for a rent ledger, so the
# database is external (Neon's free plan does not expire) and arrives as
# DATABASE_URL. `sync: false` means "prompt for this on first deploy" — values
# are never committed.
#
# Deploy: Render dashboard → New → Blueprint → pick this repo.

services:
  - type: web
    name: rental-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── App ──────────────────────────────────────────────────────
      # `production` also disables /docs and /redoc.
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # The API serves the frontend build, so the app is same-origin.
      - key: SERVE_FRONTEND
        value: "true"

      # ── Database (external: Neon) ─────────────────────────────────
      # Full DSN, asyncpg driver, e.g.
      #   postgresql+asyncpg://USER:PASSWORD@ep-xxx-pooler.eu-central-1.aws.neon.tech/rental?sslmode=require
      # `sslmode` and pooler hosts are translated automatically in
      # app/core/database.py.
      - key: DATABASE_URL
        sync: false
      # Free tiers cap connections hard (Neon's pooler included). The app's own
      # defaults of 30 + 5 are meant for a local server, not a free database
      # with a single instance behind it.
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"

      # ── Secrets ──────────────────────────────────────────────────
      # Generated by Render; safe because nothing outside this service reads them.
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # NOT generated: encryption.py does `bytes.fromhex(key)`, so this must be
      # 64 hex characters. Generate with `openssl rand -hex 32` and paste it.
      # Changing it later makes previously encrypted data unreadable.
      - key: ENCRYPTION_KEY
        sync: false

      # ── CORS ─────────────────────────────────────────────────────
      # Same-origin serving means the browser never sends a cross-origin
      # request, so this only needs the deployed URL (and localhost for the
      # desktop shell). Comma-separated.
      - key: CORS_ORIGINS
        value: https://rental-os.onrender.com,http://localhost:5173

      # ── Optional integrations ────────────────────────────────────
      # Leave unset to run without them; the app degrades rather than fails.
      - key: MPESA_CALLBACK_SECRET
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_WHATSAPP_NUMBER
        sync: false
